name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # 관측소 스냅샷(공개 Gist). 공개물이라 secret 이 아니고, 여기 적혀 있어야
          # 어느 하늘을 보고 있는지 리뷰에서 읽힌다. 갱신은 harness `build-snapshot.mjs --publish`.
          NEXT_PUBLIC_OBSERVATORY_SNAPSHOT_URL: https://gist.githubusercontent.com/chaeeun037/1fdfc6c8a60f3399106bf194e705e085/raw/observatory-snapshot.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
